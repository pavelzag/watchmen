name: Deploy (production)

# Generic caller: all deployment logic and environment specifics live in the
# watchmen-infra repository and are executed by its reusable workflow.
# Keeping this file environment-agnostic means the app repo carries no
# cloud project, domain, or service account details.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# A newer push supersedes the in-flight deploy; only the newest master
# commit should end up serving production.
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    uses: pavelzag/watchmen-infra/.github/workflows/deploy-watchmen.yml@master
    permissions:
      id-token: write # let the reusable workflow mint the GCP WIF token
      contents: read
