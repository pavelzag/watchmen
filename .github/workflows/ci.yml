name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  socket-security:
    name: Socket Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: socket-security/socket-action@v2
        with:
          api-key: ${{ secrets.SOCKET_SECURITY_API_KEY }}

  typecheck-lint:
    name: Type-check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Tests
        run: npm run test
