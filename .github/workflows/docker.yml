name: Build & Push Docker Image

on:
  push:
    branches: [main]
    tags:
      - "v*"          # e.g. v1.0.0 → image tagged as 1.0.0
  pull_request:
    branches: [main]  # builds but does NOT push on PRs
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, for example v0.4.0 or 0.4.0"
        required: true
        type: string
      publish_latest:
        description: "Also tag this image as latest"
        required: true
        default: true
        type: boolean
      create_github_release:
        description: "Create a GitHub Release for this version"
        required: true
        default: true
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # e.g. yourorg/watchmen

jobs:
  build-push:
    name: Build & Push
    runs-on: ubuntu-latest

    permissions:
      contents: write  # needed to create GitHub Releases
      packages: write   # needed to push to ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Run GitHub integration tests
        run: npm run test:github

      # ── Build cache & multi-platform support ──────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Authenticate to GitHub Container Registry ─────────────────────────
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare release metadata
        id: release
        shell: bash
        run: |
          tag=""
          publish_latest="false"
          create_github_release="false"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.version }}"
            publish_latest="${{ inputs.publish_latest }}"
            create_github_release="${{ inputs.create_github_release }}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
            publish_latest="true"
            create_github_release="true"
          fi

          if [[ -z "${tag}" ]]; then
            {
              echo "publish_latest=${publish_latest}"
              echo "create_github_release=${create_github_release}"
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          version="${tag#v}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version must look like v0.4.0 or 0.4.0"
            exit 1
          fi

          IFS=. read -r major minor _ <<< "${version}"
          {
            echo "tag=v${version}"
            echo "version=${version}"
            echo "major_minor=${major}.${minor}"
            echo "major=${major}"
            echo "publish_latest=${publish_latest}"
            echo "create_github_release=${create_github_release}"
          } >> "${GITHUB_OUTPUT}"

      # ── Derive image tags and OCI labels from Git metadata ────────────────
      # Tags produced:
      #   push to main  → ghcr.io/yourorg/watchmen:main, :sha-<short>
      #   push v1.2.3   → ghcr.io/yourorg/watchmen:1.2.3, :1.2, :1, :latest
      #   manual v1.2.3 → ghcr.io/yourorg/watchmen:1.2.3, :1.2, :1, optional :latest
      #   PR            → ghcr.io/yourorg/watchmen:pr-42 (built only, not pushed)
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=${{ steps.release.outputs.version }},enable=${{ steps.release.outputs.version != '' }}
            type=raw,value=${{ steps.release.outputs.major_minor }},enable=${{ steps.release.outputs.version != '' }}
            type=raw,value=${{ steps.release.outputs.major }},enable=${{ steps.release.outputs.version != '' }}
            type=raw,value=latest,enable=${{ steps.release.outputs.publish_latest == 'true' }}
            type=sha,prefix=sha-,format=short

      # ── Build (and push when not a PR) ───────────────────────────────────
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache backed by GitHub Actions cache — drastically speeds up rebuilds
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Build for both amd64 (most servers) and arm64 (Apple Silicon / GKE Arm nodes)
          platforms: linux/amd64,linux/arm64

      - name: Create GitHub Release
        if: steps.release.outputs.version != '' && github.event_name != 'pull_request' && steps.release.outputs.create_github_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Watchmen ${{ steps.release.outputs.tag }}
          generate_release_notes: true
          body: |
            Docker image:

            ```sh
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.release.outputs.version }}
            ```
