name: Build & Push Docker Image

on:
  push:
    branches: [main]
    tags:
      - "v*"          # e.g. v1.0.0 → image tagged as 1.0.0
  pull_request:
    branches: [main]  # builds but does NOT push on PRs

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # e.g. yourorg/watchmen

jobs:
  build-push:
    name: Build & Push
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write   # needed to push to ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Run GitHub integration tests
        run: npm run test:github

      # ── Build cache & multi-platform support ──────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Authenticate to GitHub Container Registry ─────────────────────────
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Derive image tags and OCI labels from Git metadata ────────────────
      # Tags produced:
      #   push to main  → ghcr.io/yourorg/watchmen:main, :sha-<short>
      #   push v1.2.3   → ghcr.io/yourorg/watchmen:1.2.3, :1.2, :1, :latest
      #   PR            → ghcr.io/yourorg/watchmen:pr-42 (built only, not pushed)
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short

      # ── Build (and push when not a PR) ───────────────────────────────────
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache backed by GitHub Actions cache — drastically speeds up rebuilds
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Build for both amd64 (most servers) and arm64 (Apple Silicon / GKE Arm nodes)
          platforms: linux/amd64,linux/arm64
