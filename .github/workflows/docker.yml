name: Build & Push Docker Image

on:
  push:
    branches: [main, master]
    tags:
      - "v*"          # e.g. v1.0.0 → image tagged as 1.0.0
  pull_request:
    branches: [main, master]  # builds but does NOT push on PRs
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, for example v0.4.0 or 0.4.0"
        required: true
        type: string
      publish_latest:
        description: "Also tag this image as latest"
        required: true
        default: true
        type: boolean
      create_github_release:
        description: "Create a GitHub Release for this version"
        required: true
        default: true
        type: boolean

# A newer push to the same ref supersedes any in-flight image build.
concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # e.g. yourorg/watchmen

jobs:
  # ── Gate: type-check + integration tests before any image is built ────────
  verify:
    name: Type-check & tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Run GitHub integration tests
        run: npm run test:github

  # ── Build each platform on its NATIVE runner ──────────────────────────────
  # linux/arm64 is built on a native Arm runner (free for public repos) instead
  # of emulating it with QEMU on an x86 host: the Next.js/SWC build worker
  # crashes with SIGILL under QEMU emulation, and emulated builds are ~5x slower.
  build:
    name: Build image (${{ matrix.id }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - id: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      packages: write  # needed to push per-platform images to ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Labels for the per-platform images. Tags are applied when the manifest
      # list is assembled in the merge job.
      - name: Docker metadata (labels)
        id: bmeta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # PRs: build to validate the Dockerfile compiles, but push nothing.
      - name: Build (PR validation)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.bmeta.outputs.labels }}
          cache-from: type=gha,scope=build-${{ matrix.id }}
          cache-to: type=gha,scope=build-${{ matrix.id }},mode=max

      # Push the platform image by digest (untagged); the merge job assembles
      # the multi-arch manifest list and applies the tags.
      - name: Build and push by digest
        id: build
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.bmeta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=build-${{ matrix.id }}
          cache-to: type=gha,scope=build-${{ matrix.id }},mode=max

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.id }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # ── Assemble the multi-arch manifest and apply tags ────────────────────────
  merge:
    name: Merge & push manifest
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to create GitHub Releases
      packages: write   # needed to push to ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare release metadata
        id: release
        shell: bash
        run: |
          tag=""
          publish_latest="false"
          create_github_release="false"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.version }}"
            publish_latest="${{ inputs.publish_latest }}"
            create_github_release="${{ inputs.create_github_release }}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
            publish_latest="true"
            create_github_release="true"
          fi

          if [[ -z "${tag}" ]]; then
            {
              echo "publish_latest=${publish_latest}"
              echo "create_github_release=${create_github_release}"
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          version="${tag#v}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version must look like v0.4.0 or 0.4.0"
            exit 1
          fi

          IFS=. read -r major minor _ <<< "${version}"
          {
            echo "tag=v${version}"
            echo "version=${version}"
            echo "major_minor=${major}.${minor}"
            echo "major=${major}"
            echo "publish_latest=${publish_latest}"
            echo "create_github_release=${create_github_release}"
          } >> "${GITHUB_OUTPUT}"

      # ── Derive image tags and OCI labels from Git metadata ────────────────
      # Tags produced:
      #   push to main  → ghcr.io/yourorg/watchmen:main, :sha-<short>
      #   push v1.2.3   → ghcr.io/yourorg/watchmen:1.2.3, :1.2, :1, :latest
      #   manual v1.2.3 → ghcr.io/yourorg/watchmen:1.2.3, :1.2, :1, optional :latest
      #   PR            → ghcr.io/yourorg/watchmen:pr-42 (built only, not pushed)
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=${{ steps.release.outputs.version }},enable=${{ steps.release.outputs.version != '' }}
            type=raw,value=${{ steps.release.outputs.major_minor }},enable=${{ steps.release.outputs.version != '' }}
            type=raw,value=${{ steps.release.outputs.major }},enable=${{ steps.release.outputs.version != '' }}
            type=raw,value=latest,enable=${{ steps.release.outputs.publish_latest == 'true' }}
            type=sha,prefix=sha-,format=short

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        shell: bash
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_NAME}"
          tag_args=()
          while IFS= read -r t; do
            [ -n "$t" ] && tag_args+=(--tag "$t")
          done <<< "${{ steps.meta.outputs.tags }}"
          digest_args=()
          for f in *; do
            digest_args+=("${image}@sha256:${f}")
          done
          docker buildx imagetools create "${digest_args[@]}" "${tag_args[@]}"

      - name: Create GitHub Release
        if: steps.release.outputs.version != '' && github.event_name != 'pull_request' && steps.release.outputs.create_github_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Watchmen ${{ steps.release.outputs.tag }}
          generate_release_notes: true
          body: |
            Docker image:

            ```sh
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.release.outputs.version }}
            ```
