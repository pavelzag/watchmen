# ─────────────────────────────────────────────────────────────────────────────
# Watchmen eBPF Agent — DaemonSet
#
# Runs one privileged agent pod per Linux node. The agent traces process
# execution events and forwards them to the Watchmen server.
#
# The binary is downloaded from GitHub Releases via an init container.
# Configure agent authentication via the watchmen-agent-secret Secret.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: watchmen-ebpf-agent
  namespace: watchmen
  labels:
    app.kubernetes.io/name: watchmen
    app.kubernetes.io/component: ebpf-agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: watchmen
      app.kubernetes.io/component: ebpf-agent
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: watchmen
        app.kubernetes.io/component: ebpf-agent
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        - operator: Exists
          effect: NoSchedule
      terminationGracePeriodSeconds: 30

      initContainers:
        - name: install
          image: alpine:3.20
          command:
            - /bin/sh
            - -c
            - |
              set -eu

              wget -qO /opt/watchmen/watchmen-ebpf-agent "$WATCHMEN_AGENT_BINARY_URL"
              chmod 0755 /opt/watchmen/watchmen-ebpf-agent

              KERNEL="$(uname -r 2>/dev/null || echo '')"
              HOSTNAME_VAL="$(hostname 2>/dev/null || echo '')"

              PAYLOAD='{"clusterName":"'$CLUSTER_NAME'","projectId":"'$PROJECT_ID'","location":"'$LOCATION'","nodeName":"'"$HOSTNAME_VAL"'","agentSecret":"'"$AGENT_SECRET"'","agentVersion":"'$AGENT_VERSION'","kernelVersion":"'"$KERNEL"'"}'

              wget -qO- --header="Content-Type: application/json" \
                --post-data="$PAYLOAD" \
                "$REGISTER_URL" 2>/dev/null || echo "registration skipped (server unreachable)"
          env:
            - name: WATCHMEN_AGENT_BINARY_URL
              value: "https://github.com/pavelzag/watchmen/releases/download/agent-v0.1.0/watchmen-ebpf-agent-linux-amd64"
            - name: CLUSTER_NAME
              value: "REPLACE_ME"
            - name: PROJECT_ID
              value: "REPLACE_ME"
            - name: LOCATION
              value: "REPLACE_ME"
            - name: AGENT_VERSION
              value: "0.1.0"
            - name: REGISTER_URL
              value: "https://REPLACE_ME/api/agents/k8s/register"
            - name: AGENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: watchmen-agent-secret
                  key: agent_secret
          volumeMounts:
            - name: opt
              mountPath: /opt/watchmen

      containers:
        - name: agent
          image: alpine:3.20
          command: [/opt/watchmen/watchmen-ebpf-agent]
          env:
            - name: WATCHMEN_ENDPOINT
              value: "http://watchmen.watchmen.svc.cluster.local/api/agents/events"
            - name: WATCHMEN_AGENT_ID
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: WATCHMEN_AGENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: watchmen-agent-secret
                  key: agent_secret
            - name: WATCHMEN_VERBOSE
              value: "1"
          securityContext:
            privileged: true
          volumeMounts:
            - name: opt
              mountPath: /opt/watchmen
              readOnly: true
            - name: debugfs
              mountPath: /sys/kernel/debug
            - name: tracefs
              mountPath: /sys/kernel/tracing
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi

      volumes:
        - name: opt
          emptyDir: {}
        - name: debugfs
          hostPath:
            path: /sys/kernel/debug
        - name: tracefs
          hostPath:
            path: /sys/kernel/tracing
