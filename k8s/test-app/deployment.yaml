apiVersion: apps/v1
kind: Deployment
metadata:
  name: wm-echo
  namespace: watchmen
  labels:
    app: wm-echo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wm-echo
  template:
    metadata:
      labels:
        app: wm-echo
    spec:
      containers:
        - name: echo
          image: gcr.io/watchmen-test-488807/wm-echo:latest
          ports:
            - containerPort: 8080
          env:
            - name: DB_DSN
              valueFrom:
                secretKeyRef:
                  name: wm-echo-db
                  key: dsn
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
